<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive 3D model of the Solar System built with three.js." />
    <title>Solar System</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <section id="panel" aria-label="Controls">
      <h1>Solar System</h1>
      <div class="row">
        <button id="pause" type="button" aria-pressed="false">Pause</button>
        <label class="speed">
          <span>Speed</span>
          <input id="speed" type="range" min="0" max="10" step="0.1" value="1" />
          <output id="speed-value" for="speed">1.0×</output>
        </label>
      </div>
      <div class="row">
        <label class="toggle"><input id="orbits" type="checkbox" checked /> Orbits</label>
        <label class="toggle"><input id="labels" type="checkbox" checked /> Labels</label>
      </div>
      <p class="hint">Drag to rotate · Scroll to zoom · Click a planet to follow it · Esc to go back</p>
    </section>

    <aside id="info" aria-live="polite">
      <h2 id="info-name"></h2>
      <dl id="info-facts"></dl>
      <p class="note">Sizes, distances and speeds are not to scale.</p>
    </aside>

    <nav id="bodies" aria-label="Focus on"></nav>

    <div id="loading">Loading textures…</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
